[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "company-briefer"
version = "0.1.0"
description = "Polite, bounded pre-call research briefs for a company, grounded only in its public marketing pages."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "VybeTech Labs" }]
keywords = ["research", "sales", "brief", "scraping", "llm", "positioning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "typer>=0.12",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[project.scripts]
company-briefer = "company_briefer.cli:app"

[project.urls]
Homepage = "https://github.com/vybetechlabs-blip/company-briefer"

[tool.hatch.build.targets.wheel]
packages = ["company_briefer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "bs4.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=company_briefer --cov-report=term-missing"

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
